[project]
name = "mintok"
version = "0.1.0"
description = "Open inference compiler: the minimum frontier-model computation per verified software change."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mintok = "mintok.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mintok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features/"
addopts = "--strict-markers"
filterwarnings = [
    "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin",
]
markers = [
    "domain: pure logic, no subprocess or filesystem-heavy work",
    "integration: CLI and compiler over real files on disk",
]
